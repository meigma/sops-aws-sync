version = 1

[provenance]
signer_workflow = "meigma/sops-aws-sync/.github/workflows/attest.yml"

[[packages]]
name = "sops-aws-sync"
description = "Reconcile committed SOPS JSON with AWS Secrets Manager."
tag_pattern = "v${version}"

[[packages.assets]]
os = "darwin"
arch = "amd64"
pattern = "sops-aws-sync_${version}_darwin_amd64"

[[packages.assets]]
os = "darwin"
arch = "arm64"
pattern = "sops-aws-sync_${version}_darwin_arm64"

[[packages.assets]]
os = "linux"
arch = "amd64"
pattern = "sops-aws-sync_${version}_linux_amd64"

[[packages.assets]]
os = "linux"
arch = "arm64"
pattern = "sops-aws-sync_${version}_linux_arm64"

[[packages.binaries]]
path = "sops-aws-sync"
