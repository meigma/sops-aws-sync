site_name: sops-aws-sync
site_description: Reconcile committed SOPS documents with AWS Secrets Manager
site_url: https://meigma.github.io/sops-aws-sync/
repo_name: meigma/sops-aws-sync
repo_url: https://github.com/meigma/sops-aws-sync
edit_uri: edit/master/docs/docs/
docs_dir: docs
site_dir: build
strict: true

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Tutorial:
      - Your first reconciliation: tutorial/first-reconciliation.md
  - How-to guides:
      - Deploy with GitHub Actions: how-to/deploy-with-github-actions.md
      - Grant AWS access: how-to/grant-aws-access.md
      - Verify a release binary: how-to/verify-a-release-binary.md
      - Decommission a scope: how-to/decommission-a-scope.md
      - Diagnose and recover: how-to/diagnose-and-recover.md
  - Explanation:
      - The reconciliation model: explanation/reconciliation-model.md
      - Ownership and scope: explanation/ownership-and-scope.md
      - Consistency and recovery: explanation/consistency-and-recovery.md
      - Security and trust: explanation/security-and-trust.md
  - Reference:
      - Configuration: reference/configuration.md
      - Reconciliation: reference/reconciliation.md
      - Results and exit codes: reference/results.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/palette.css
