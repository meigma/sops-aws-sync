# Reusable binary provenance workflow isolated from the artifact build job.
name: Attest (reusable)

on:
  workflow_call:
    inputs:
      checksums-artifact:
        description: Uploaded artifact containing checksums.txt.
        type: string
        required: true

permissions: {}

jobs:
  attest:
    name: Attest
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.checksums-artifact }}

      - name: Attest binary checksums
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: checksums.txt
