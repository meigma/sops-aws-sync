name: AWS Sandbox Acceptance

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: Exact released CLI version without a leading v
        required: true
        default: 0.1.1
        type: string
      release-commit:
        description: Full immutable commit SHA behind the release tag
        required: true
        type: string

permissions: {}

concurrency:
  group: sops-aws-sync-aws-sandbox
  cancel-in-progress: false

jobs:
  acceptance:
    name: Protected AWS Action Acceptance
    runs-on: ubuntu-24.04
    environment: aws-sandbox
    permissions:
      contents: read
      id-token: write
      attestations: read
    env:
      ACCEPTANCE_PREFIX: /sops-aws-sync/acceptance/${{ github.run_id }}-${{ github.run_attempt }}
      SOPS_AGE_KEY: AGE-SECRET-KEY-1G0Q5K9TV4REQ3ZSQRMTMG8NSWQGYT0T7TZ33RAZEE0GZYVZN0APSU24RK7
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release-commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release binding
        env:
          RELEASE_COMMIT: ${{ inputs.release-commit }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release-commit must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "release-version must be an exact semantic version" >&2
            exit 1
          fi
          tag="v${RELEASE_VERSION}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "${tag}^{commit}")" = "$RELEASE_COMMIT"

      - name: Authenticate to the AWS sandbox
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          aws-region: ${{ vars.AWS_SANDBOX_REGION }}
          role-session-name: sops-aws-sync-${{ github.run_id }}

      - name: Build exact committed desired-state revisions
        id: revisions
        run: |
          set -euo pipefail
          git config user.name sops-aws-sync-acceptance
          git config user.email sops-aws-sync-acceptance@users.noreply.github.com
          mkdir -p acceptance/secrets

          cp .github/sandbox/initial.sops.json acceptance/secrets/secret.sops.json
          git add acceptance/secrets/secret.sops.json
          git commit -m "test: add initial acceptance state"
          echo "initial=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          cp .github/sandbox/updated.sops.json acceptance/secrets/secret.sops.json
          git add acceptance/secrets/secret.sops.json
          git commit -m "test: update acceptance state"
          echo "updated=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          git rm acceptance/secrets/secret.sops.json
          git commit -m "test: remove acceptance state"
          echo "empty=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create through the Action
        id: create
        uses: ./
        with:
          mode: sync
          source-root: acceptance/secrets
          secret-prefix: ${{ env.ACCEPTANCE_PREFIX }}
          revision: ${{ steps.revisions.outputs.initial }}
          repository-id: meigma/sops-aws-sync
          aws-region: ${{ vars.AWS_SANDBOX_REGION }}
          recovery-window-days: 7
          cli-version: ${{ inputs.release-version }}

      - name: Verify create result
        env:
          CREATE_COUNT: ${{ steps.create.outputs.create-count }}
          VERIFICATION: ${{ steps.create.outputs.verification-status }}
        run: |
          test "$CREATE_COUNT" = 1
          test "$VERIFICATION" = converged

      - name: Prove converged no-op through the Action
        id: noop
        uses: ./
        with:
          mode: sync
          source-root: acceptance/secrets
          secret-prefix: ${{ env.ACCEPTANCE_PREFIX }}
          revision: ${{ steps.revisions.outputs.initial }}
          repository-id: meigma/sops-aws-sync
          aws-region: ${{ vars.AWS_SANDBOX_REGION }}
          recovery-window-days: 7
          cli-version: ${{ inputs.release-version }}

      - name: Verify no-op result
        env:
          UNCHANGED_COUNT: ${{ steps.noop.outputs.unchanged-count }}
          VERIFICATION: ${{ steps.noop.outputs.verification-status }}
        run: |
          test "$UNCHANGED_COUNT" = 1
          test "$VERIFICATION" = converged

      - name: Update through the Action
        id: update
        uses: ./
        with:
          mode: sync
          source-root: acceptance/secrets
          secret-prefix: ${{ env.ACCEPTANCE_PREFIX }}
          revision: ${{ steps.revisions.outputs.updated }}
          repository-id: meigma/sops-aws-sync
          aws-region: ${{ vars.AWS_SANDBOX_REGION }}
          recovery-window-days: 7
          cli-version: ${{ inputs.release-version }}

      - name: Verify update result
        env:
          UPDATE_COUNT: ${{ steps.update.outputs.update-count }}
          VERIFICATION: ${{ steps.update.outputs.verification-status }}
        run: |
          test "$UPDATE_COUNT" = 1
          test "$VERIFICATION" = converged

      - name: Schedule deletion through the Action
        id: delete
        uses: ./
        with:
          mode: sync
          source-root: acceptance/secrets
          secret-prefix: ${{ env.ACCEPTANCE_PREFIX }}
          revision: ${{ steps.revisions.outputs.empty }}
          repository-id: meigma/sops-aws-sync
          aws-region: ${{ vars.AWS_SANDBOX_REGION }}
          recovery-window-days: 7
          allow-empty: true
          cli-version: ${{ inputs.release-version }}

      - name: Verify scheduled deletion result
        env:
          DELETE_COUNT: ${{ steps.delete.outputs.scheduled-delete-count }}
          VERIFICATION: ${{ steps.delete.outputs.verification-status }}
        run: |
          test "$DELETE_COUNT" = 1
          test "$VERIFICATION" = converged

      - name: Restore and reconcile through the Action
        id: restore
        uses: ./
        with:
          mode: sync
          source-root: acceptance/secrets
          secret-prefix: ${{ env.ACCEPTANCE_PREFIX }}
          revision: ${{ steps.revisions.outputs.initial }}
          repository-id: meigma/sops-aws-sync
          aws-region: ${{ vars.AWS_SANDBOX_REGION }}
          recovery-window-days: 7
          cli-version: ${{ inputs.release-version }}

      - name: Verify restore, follow-up update, and redacted reports
        env:
          RESTORE_COUNT: ${{ steps.restore.outputs.restore-count }}
          UPDATE_COUNT: ${{ steps.restore.outputs.update-count }}
          VERIFICATION: ${{ steps.restore.outputs.verification-status }}
          CREATE_REPORT: ${{ steps.create.outputs.redacted-report-path }}
          NOOP_REPORT: ${{ steps.noop.outputs.redacted-report-path }}
          UPDATE_REPORT: ${{ steps.update.outputs.redacted-report-path }}
          DELETE_REPORT: ${{ steps.delete.outputs.redacted-report-path }}
          RESTORE_REPORT: ${{ steps.restore.outputs.redacted-report-path }}
        run: |
          set -euo pipefail
          test "$RESTORE_COUNT" = 1
          test "$UPDATE_COUNT" = 1
          test "$VERIFICATION" = converged
          for report in "$CREATE_REPORT" "$NOOP_REPORT" "$UPDATE_REPORT" "$DELETE_REPORT" "$RESTORE_REPORT"; do
            test -s "$report"
            if grep -E 'phase5-(sensitive|updated)|credential|acceptance/' "$report"; then
              echo "redacted report disclosed protected acceptance data" >&2
              exit 1
            fi
          done

      - name: Leave the acceptance secret in recoverable deletion
        id: cleanup
        if: ${{ always() && steps.revisions.outcome == 'success' }}
        uses: ./
        with:
          mode: sync
          source-root: acceptance/secrets
          secret-prefix: ${{ env.ACCEPTANCE_PREFIX }}
          revision: ${{ steps.revisions.outputs.empty }}
          repository-id: meigma/sops-aws-sync
          aws-region: ${{ vars.AWS_SANDBOX_REGION }}
          recovery-window-days: 7
          allow-empty: true
          cli-version: ${{ inputs.release-version }}
