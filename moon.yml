language: 'go'
layer: 'application'
stack: 'backend'

project:
  title: 'sops-aws-sync'
  description: 'Reconcile committed SOPS JSON with AWS Secrets Manager.'
  owner: 'meigma'
  maintainers:
    - 'meigma'

# Every task runs against `system` binaries that mise (mise.toml + mise.lock) puts
# on PATH; moon manages no language toolchain itself.
toolchains:
  default: 'system'

fileGroups:
  goSources:
    - 'cmd/**/*.go'
    - 'internal/**/*.go'
    - 'go.mod'
    - 'go.sum'
    # Tool/version pins. Under the `system` toolchain moon does not hash the Go
    # binary's version, so the mise pins are inputs here too — bumping Go (or any
    # tool) in mise must invalidate the cacheable build task.
    - 'mise.toml'
    - 'mise.lock'
  lintConfig:
    - '.golangci.yml'
    - 'mise.toml'
    - 'mise.lock'
  releaseConfig:
    - '.goreleaser.yaml'
    - 'ghd.toml'
    - 'release-please-config.json'
    - '.release-please-manifest.json'
    - '.github/workflows/*.yml'
  actionSources:
    - 'action.yml'
    - 'action/**/*'
    - 'mise.toml'
    - 'mise.lock'

workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    command: 'golangci-lint fmt --config .golangci.yml --diff'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  lint:
    command: 'golangci-lint run --config .golangci.yml ./cmd/... ./internal/... --show-stats=false'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  build:
    command: 'go build -o bin/sops-aws-sync ./cmd/sops-aws-sync'
    inputs:
      - '@group(goSources)'
    outputs:
      - 'bin/sops-aws-sync'

  godoc:
    command: 'go run ./internal/tools/godoccheck ./cmd ./internal'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  test:
    command: 'go test ./cmd/... ./internal/...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  race:
    command: 'go test -race ./cmd/... ./internal/...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  vuln:
    command: 'go tool govulncheck ./cmd/... ./internal/...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  workflows:
    command: 'go tool actionlint'
    inputs:
      - '@group(goSources)'
      - '@group(releaseConfig)'
    options:
      cache: false

  check:
    deps:
      - 'root:format'
      - 'root:lint'
      - 'root:build'
      - 'root:test'
      - 'root:race'
      - 'root:vuln'
      - 'root:workflows'
      - 'root:godoc'
      - 'action:check'
      - 'docs:build'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(releaseConfig)'
      - '@group(actionSources)'
    options:
      cache: false
      runInCI: true
